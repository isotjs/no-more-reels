<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            min-width: 320px;
            max-width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .container {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            flex-direction: column; 
            align-items: center; 
            gap: 8px; 
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 16px;
        }

        .header-main {
            display: flex;
            align-items: center; 
            gap: 12px; 
        }
                        
        .title {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            margin-bottom: 0;
            font-size: 22px; 
            line-height: 1.2;
        }

        .subtitle {
            padding-left: 0; 
            width: 100%;   
            font-size: 13px;
            color: #888;
            line-height: 1.4;
        }
        
        .logo {
            margin-bottom: 0;
        }   

        .logo-image {
            width: 64px;
            height: auto;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.2s ease;
        }
        
        .status-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            line-height: 1.3;
        }
        
        .status-active {
            color: #4ade80;
        }
        
        .status-inactive {
            color: #f87171;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            padding: 8px 0;
        }
        
        .toggle-label {
            font-size: 14px;
            color: #ccc;
            font-weight: 500;
            min-width: 40px;
            text-align: center;
        }
        
        .toggle {
            position: relative;
            width: 56px;
            height: 32px;
            flex-shrink: 0;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        input:checked + .toggle-slider {
            background-color: #4ade80;
            border-color: #4ade80;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        .grayscale-container {
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .grayscale-label {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        .threads-container {
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .threads-label {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        .actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            touch-action: manipulation;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: scale(0.96);
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .footer {
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .version {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .hidden-items {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }
        
        .hidden-list {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .hidden-tag {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        
        .hidden-tag.clickable {
            cursor: pointer;
        }
        
        .hidden-tag.clickable:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }
        
        .hidden-tag.clickable:active {
            transform: scale(0.95);
        }
        
        .hidden-tag.active {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .message.show {
            opacity: 1;
        }
        
        .footer {
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px; 
        }

        .footer-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .footer-btn {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ccc;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .footer-btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        
        .debug-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0;
        }
        
        .debug-btn.active {
            background-color: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        
        .debug-btn.active:hover {
            background-color: rgba(34, 197, 94, 0.3);
        }

        /* Mobile-specific optimizations */
        @media (max-width: 480px) {
            .container {
                padding: 16px 12px;
                gap: 12px;
            }
            
            .header-main {
                gap: 10px;
            }
            
            .title {
                font-size: 20px;
            }
            
            .logo-image {
                width: 56px;
            }
            
            .status-card {
                padding: 16px;
                border-radius: 14px;
            }
            
            .toggle-container {
                gap: 12px;
            }
            
            .toggle {
                width: 52px;
                height: 30px;
            }
            
            .toggle-slider:before {
                height: 22px;
                width: 22px;
            }
            
            input:checked + .toggle-slider:before {
                transform: translateX(22px);
            }
            
            .hidden-tag {
                padding: 6px 12px;
                font-size: 12px;
                min-height: 32px;
            }
            
            .footer-actions {
                gap: 8px;
            }
            
            .footer-btn {
                padding: 8px 12px;
                font-size: 12px;
                min-height: 36px;
            }
        }

        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .btn:hover,
            .hidden-tag.clickable:hover,
            .footer-btn:hover {
                transform: none;
            }
            
            .btn:active,
            .hidden-tag.clickable:active,
            .footer-btn:active {
                transform: scale(0.95);
            }
            
            .toggle-slider {
                cursor: default;
            }
        }

        /* High DPI displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .toggle-slider:before {
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            }
        }
    </style>
</head>
<body>
    <div class="container">
<div class="header">
    <div class="header-main">
        <div class="logo">
            <img src="Assets/icon96.png" alt="Eklenti Logosu" class="logo-image">
        </div>
        <div class="title" data-i18n="popupTitle"></div>
    </div>
    <div class="subtitle" data-i18n="popupSubtitle"></div>
</div>
        
        <div class="main-content">
            <div class="status-card">
                <div class="status-text" id="statusText" data-i18n="statusText"></div>
                
                <div class="toggle-container">
                    <span class="toggle-label" data-i18n="toggleOff"></span>
                    <label class="toggle">
                        <input type="checkbox" id="toggleSwitch" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label" data-i18n="toggleOn"></span>
                </div>
                
                <div class="hidden-items" id="hiddenItems">
                    <div class="hidden-list">
                        <span class="hidden-tag clickable" id="reelsTag" data-i18n="hiddenItemsReels"></span>
                        <span class="hidden-tag clickable" id="exploreTag" data-i18n="hiddenItemsExplore"></span>
                    </div>
                </div>
                
                <div class="grayscale-container">
                    <div class="grayscale-label" data-i18n="grayscaleMode"></div>
                    <div class="toggle-container">
                        <span class="toggle-label" data-i18n="toggleOff"></span>
                        <label class="toggle">
                            <input type="checkbox" id="grayscaleSwitch">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="toggle-label" data-i18n="toggleOn"></span>
                    </div>
                </div>
                
                <div class="threads-container">
                    <div class="threads-label" data-i18n="threadsButtonMode"></div>
                    <div class="toggle-container">
                        <span class="toggle-label" data-i18n="toggleOff"></span>
                        <label class="toggle">
                            <input type="checkbox" id="threadsSwitch">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="toggle-label" data-i18n="toggleOn"></span>
                    </div>
                </div>
        
            </div>
        </div>

        <div class="footer">
            <div class="version" id="versionText"></div>
            <div class="footer-actions">
                <a href="https://github.com/isotjs/no-more-reels/discussions" target="_blank" class="footer-btn" data-i18n="footerButtonHelp"></a>
                <button id="debugToggle" class="footer-btn debug-btn" title="Toggle Dev Tools" aria-label="Toggle Dev Tools" aria-pressed="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 8L3 12L7 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 8L21 12L17 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 4L9.8589 19.4548" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <a href="https://github.com/isotjs/no-more-reels" target="_blank" class="footer-btn" data-i18n="footerButtonGitHub"></a>
            </div>
        </div>
    </div>

    <div id="messageContainer" class="message"></div>

    <script src="popup.js"></script>
</body>
</html>
